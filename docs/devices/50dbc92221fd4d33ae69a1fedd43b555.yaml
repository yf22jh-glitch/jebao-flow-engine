  notes:
    - Two devices returned complete 452-byte status payloads.
    - Both live reads decoded as powered on and independent linkage.
    - Bounded low-power register writes and exact restoration were read back on both devices.
    - An async-slave-only Flow change was attempted, but delivery and full-state read-back were not proven; independent Flow remains unqualified.
    - An up-to-150-second TimerON Async run stopped safely shortly after the planned slave Flow change.
    - The run issued zero of two qualification receipts and did not authorize schedule-linkage.
    - Automatic exact restore remained incomplete; a fresh attended recovery restored both snapshots.
    - A restarted read-only observer reconfirmed the pre-test TimerON states.
    - Three later low-power Sync qualification attempts also issued zero of two receipts.
    - The last attempt exposed ACTIVE-session reuse at slave detach; attended recovery restored both snapshots.
    - A later 31/31 low-power Sync run validated the slave-first boundary, exact restore, and two receipts.
    - The following Async 35/33 to slave-38 diagnostic still required attended recovery after rollback failed.
    - The Async intent recorded no typed primary failure, so independent slave Flow remains unqualified.
    - A version-2 repeat proved only that the slave-38 write path was attempted; adapter and full-state verification both remained absent.
    - Attended recovery restored the original TimerON values, and fresh Observer reads matched all 14 valid schedule slots and both saved fingerprints.
    - Retry4 reached both native roles and showed Mode, Frequency, AutoMode, AutoFlow, and AutoFreq converging across separate reports; the 300-second independent slave result was not proven.
    - Retry5 stopped before its first Linkage write because a newly sampled pair NowTime exceeded the two-second skew gate; exact controls and both 432-byte images were restored.
    - Timing and retry4/retry5 details are reconstructed operator observations (grade c), not preserved raw captures; see docs/runs/2026-08-26--2026-08-28-native-linkage-history.md.

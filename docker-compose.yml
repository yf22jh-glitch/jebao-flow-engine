services:
  jebao-flowd:
    build: .
    container_name: jebao-flowd
    restart: unless-stopped
    network_mode: host
    environment:
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set MQTT_PASSWORD before starting}
      JEBAO_FLOW_HARDWARE_SAFETY_VOLUME_ID: ${JEBAO_FLOW_HARDWARE_SAFETY_VOLUME_ID:?set JEBAO_FLOW_HARDWARE_SAFETY_VOLUME_ID before starting}
    volumes:
      - ${JEBAO_FLOW_CONFIG:-./config.example.yaml}:/config/config.yaml:ro
      - jebao-flow-data:/data
      - jebao-flow-hardware-safety:/hardware-safety
    read_only: true
    tmpfs:
      - /tmp

  jebao-flow-recovery:
    profiles: ["hardware"]
    build: .
    container_name: jebao-flow-recovery
    restart: unless-stopped
    network_mode: host
    environment:
      JEBAO_FLOW_HARDWARE_SAFETY_VOLUME_ID: ${JEBAO_FLOW_HARDWARE_SAFETY_VOLUME_ID:?set JEBAO_FLOW_HARDWARE_SAFETY_VOLUME_ID before starting}
    volumes:
      - ${JEBAO_FLOW_HARDWARE_CONFIG:-./config.hardware-test.example.yaml}:/config/hardware-test.yaml:ro
      - jebao-flow-data:/data
      - jebao-flow-hardware-safety:/hardware-safety
    read_only: true
    tmpfs:
      - /tmp
    entrypoint: ["jebao-flow-recovery"]
    command: ["--config", "/config/hardware-test.yaml", "--poll-interval", "0.5"]
    stop_grace_period: 2m

  jebao-flow-hardware-safety-provision:
    profiles: ["hardware-safety-provisioning"]
    build: .
    container_name: jebao-flow-hardware-safety-provision
    restart: "no"
    network_mode: none
    environment:
      JEBAO_FLOW_HARDWARE_SAFETY_VOLUME_ID: ${JEBAO_FLOW_HARDWARE_SAFETY_VOLUME_ID:?set JEBAO_FLOW_HARDWARE_SAFETY_VOLUME_ID before starting}
    volumes:
      - jebao-flow-hardware-safety:/hardware-safety
    read_only: true
    tmpfs:
      - /tmp
    entrypoint: ["jebao-flow-hardware-safety"]
    command: ["verify"]

volumes:
  jebao-flow-data:
  jebao-flow-hardware-safety:
    name: jebao-flow-hardware-safety

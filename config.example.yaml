instance:
  id: main
  name: Main Aquarium
  timezone: Asia/Seoul

mqtt:
  host: 192.168.0.10
  port: 1883
  username: jebao_flow
  password_env: MQTT_PASSWORD
  discovery_prefix: homeassistant
  topic_prefix: jebao-flow/main

runtime:
  state_path: /data/state.json
  log_level: INFO
  # Observer mode rejects every MQTT control command and forces the LAN write gate closed.
  mode: observer
  dry_run: true

observer:
  enabled: true
  journal_path: /data/observations.jsonl
  # Use the directed broadcast address of the isolated IoT VLAN when needed.
  targets:
    - 255.255.255.255
  bind_address: 0.0.0.0
  discovery_timeout_seconds: 3
  rediscovery_interval_seconds: 30
  poll_interval_seconds: 5
  # Unchanged observations stay in memory; MQTT/HA freshness is limited to avoid Recorder growth.
  publish_heartbeat_seconds: 300
  reconnect_initial_seconds: 2
  reconnect_max_seconds: 60

devices:
  - id: wavemaker_left
    name: 왼쪽 메인 수류모터
    type: wavemaker
    discovery: auto
    # Put the real values only in the private home-server config. Repeat for every device.
    # identity:
    #   device_id: replace_with_gizwits_device_id
    #   mac_address: replace_with_12_hex_mac
    limits:
      min_power: 30
      max_power: 80
    control:
      minimum_command_interval_ms: 1000
      restore_on_reconnect: true
      # Keep false until a reviewed low-output hardware test.
      allow_hardware_writes: false
      readback_delay_ms: 500
      readback_attempts: 3

  - id: wavemaker_right
    name: 오른쪽 메인 수류모터
    type: wavemaker
    discovery: auto
    limits:
      min_power: 30
      max_power: 75
    control:
      minimum_command_interval_ms: 1000
      restore_on_reconnect: true
      allow_hardware_writes: false
      readback_delay_ms: 500
      readback_attempts: 3

  - id: wavemaker_bar
    name: 바형 크로스플로우
    type: wavemaker
    discovery: auto
    limits:
      min_power: 30
      max_power: 75
    control:
      minimum_command_interval_ms: 1000
      restore_on_reconnect: true
      allow_hardware_writes: false
      readback_delay_ms: 500
      readback_attempts: 3

  - id: return_main
    name: 메인 리턴펌프
    type: return_pump
    discovery: auto
    limits:
      min_power: 30
      max_power: 80
    control:
      allow_hardware_writes: false

  - id: return_aux
    name: 보조 리턴펌프
    type: return_pump
    discovery: auto
    limits:
      min_power: 30
      max_power: 80
    control:
      allow_hardware_writes: false

  - id: dosing_main
    name: 도징펌프
    type: dosing_pump
    discovery: auto
    control:
      allow_hardware_writes: false

groups:
  - id: main_flow
    name: 메인 수류
    enabled: true
    members:
      - device: wavemaker_left
        role: left
        gain: 1.0
        phase: 0
      - device: wavemaker_right
        role: right
        gain: 0.85
        phase: 180
      - device: wavemaker_bar
        role: crossflow
        gain: 0.75
        phase: 90
    default:
      pattern: anti_phase
      power: 65
      min_power: 35
      max_power: 75
      period_seconds: 8
    failure_policy:
      on_member_offline: continue_limited
      remaining_member_max_power: 50

modes:
  feed:
    duration_seconds: 600
    wavemaker_power: 0
    return_pump_power: 30
    restore_previous_state: true
    restore_transition_seconds: 30
  night:
    max_power: 50
    pattern: constant

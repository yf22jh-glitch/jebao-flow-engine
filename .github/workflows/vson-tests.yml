name: VSON feeder regressions

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  feeder:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"
      - run: python -m pip install homeassistant==2026.9.4 pycryptodome==3.23.0
      - run: python -m unittest discover -s tests/unit -p 'test_vson_feeder*.py' -v
